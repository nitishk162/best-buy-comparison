name: Scrape Best Buy & Update Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: macbook-watch
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - uses: actions/configure-pages@v5
        id: pages

      - name: Run Scraper
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scraper.py

      - name: Build static dashboard
        run: python build_page.py
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Commit updated prices.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update prices.json via crawler"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: scrape-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

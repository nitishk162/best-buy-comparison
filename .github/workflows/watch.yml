name: MacBook price watch
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
concurrency:
  group: macbook-watch
  cancel-in-progress: false
permissions: {}
jobs:
  collect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      refresh: ${{ steps.check.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Check retailers
        id: check
        continue-on-error: true
        run: python3 check_deals.py
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - run: python3 build_page.py
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Save the price baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update observed MacBook prices"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
      - if: needs.collect.outputs.refresh == 'failure'
        run: echo "::error::No successful refresh; see the published source status and collection log."; exit 1
